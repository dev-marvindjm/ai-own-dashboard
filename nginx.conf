server {
    listen 3000;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxies to microservices in quant-network
    location /api/quant/ {
        proxy_pass http://quant-trading-api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/msg/health {
        proxy_pass http://msg_incoming_ingestor:8001/health;
        proxy_set_header Host $host;
    }

    location /api/msg/ {
        proxy_pass http://msg_incoming_ingestor:8001/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tokenizer Service Endpoints
    location = /api/tokenizer/health {
        proxy_pass http://trading-tokenizer-api:8000/health;
        proxy_set_header Host $host;
    }

    # Direct shorthand aliases for tokenization
    location = /api/tokenizer/tokenize {
        proxy_pass http://trading-tokenizer-api:8000/api/v1/tokens/tokenize;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/tokenize {
        proxy_pass http://trading-tokenizer-api:8000/api/v1/tokens/tokenize;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tokenizer/ {
        proxy_pass http://trading-tokenizer-api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tokens/ {
        proxy_pass http://trading-tokenizer-api:8000/api/v1/tokens/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/tokens/ {
        proxy_pass http://trading-tokenizer-api:8000/api/v1/tokens/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default /api/ proxy to quant-trading-api
    location /api/ {
        proxy_pass http://quant-trading-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE Proxy
    location /events {
        proxy_pass http://quant-trading-api:8000/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_read_timeout 24h;
    }
}
